[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wireguard-api"
version = "0.1.0"
description = "REST API to manage WireGuard interfaces and peers on the host"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Iker García Calviño", email = "iker.gcalvino@udc.es" },
]

dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
]

[dependency-groups]
# Lint and type tools are pinned: a new release can change their verdict and
# break CI on its own. Dependabot bumps them in a PR where CI checks them.
lint = ["ruff==0.17.3"]
test = ["pytest>=8.0", "pytest-asyncio>=0.25.0", "pytest-cov>=6.0", "httpx>=0.28.0"]
type = ["ty==0.0.92"]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "type" },
]

[project.urls]
Repository = "https://github.com/ikergcalvino/wireguard-api"
Issues = "https://github.com/ikergcalvino/wireguard-api/issues"
Changelog = "https://github.com/ikergcalvino/wireguard-api/releases"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.ty.src]
include = ["api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
