services:
  wireguard-api:
    build: .
    container_name: wireguard-api
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /etc/wireguard:/etc/wireguard:rw
    environment:
      WG_API_KEY: ""
      WG_LOG_LEVEL: INFO
      WG_CORS_ORIGINS: "*"
      WG_CONFIG_DIR: /etc/wireguard
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8000
