services:
  wireguard-api:
    build: .
    container_name: wireguard-api
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /etc/wireguard:/etc/wireguard:rw
    environment:
      # Required, at least 16 characters. Set it in the shell or in a .env file, e.g. `openssl rand -hex 32`.
      WG_API_KEY: ${WG_API_KEY:?Set WG_API_KEY to a random string of at least 16 characters}
      WG_LOG_LEVEL: INFO
      WG_CORS_ORIGINS: "*"
      WG_CONFIG_DIR: /etc/wireguard
      # Path prefix a reverse proxy publishes the API under and strips, e.g. /api/v1. Empty without a proxy.
      UVICORN_ROOT_PATH: ${UVICORN_ROOT_PATH:-}
