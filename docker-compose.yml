services:
  wireguard-api:
    build: .
    container_name: wireguard-api
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /etc/wireguard:/etc/wireguard:rw
    environment:
      # Required, at least 16 characters. Set it in the shell or in a .env file, e.g. `openssl rand -hex 32`.
      WG_API_KEY: ${WG_API_KEY:?Set WG_API_KEY to a random string of at least 16 characters}
      # Optional, also from the shell or .env.
      WG_LOG_LEVEL: ${WG_LOG_LEVEL:-INFO}
      WG_CORS_ORIGINS: ${WG_CORS_ORIGINS:-*}
      # Must match the volume above.
      WG_CONFIG_DIR: /etc/wireguard
